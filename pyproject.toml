[project]
name = "lob-browser"
version = "0.1.0"
description = "A learning implementation of a reliable browser agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "playwright>=1.55,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_browser"]
