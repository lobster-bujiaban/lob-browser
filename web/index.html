<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOB Browser · 浏览器 Agent</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">⌁</span><span>LOB Browser</span><small>AGENT WORKSPACE</small></div><button id="new-task" class="new-task">＋ 新建任务</button><div class="side-label">最近任务 <button id="clear-tasks">清空</button></div><div id="task-list" class="task-list"></div><div class="sidebar-bottom"><div class="connection"><i></i>本地浏览器已连接</div><button id="settings">⚙ 设置</button></div></aside><main class="main"><header class="topbar"><div><span class="eyebrow">BROWSER AGENT</span><h1 id="task-title">新建浏览器任务</h1></div><div class="top-actions"><span class="chip">Chromium</span><button>会话 ▾</button><button>···</button></div></header><div class="workspace"><section class="chat-panel"><div id="messages" class="messages"></div><div class="composer-wrap"><div class="suggestions"><button data-text="打开本地测试页，填写表单并确认提交成功">填写并提交表单</button><button data-text="打开下载页面，下载报表文件并告诉我保存结果">下载一份报表</button><button data-text="浏览当前页面，找到指定信息并整理出来">浏览并提取信息</button></div><form id="composer"><textarea id="prompt" rows="3" placeholder="描述你想让浏览器完成的任务…"></textarea><div class="composer-footer"><span>Agent 会先观察页面，遇到高风险操作会请求审批</span><button type="submit" class="send">发送 ↑</button></div></form></div></section><aside class="run-panel"><div class="panel-tabs"><button class="active" data-panel="run">执行状态</button><button data-panel="page">页面观察</button></div><div id="run-view" class="run-view"><div class="run-summary"><div><span class="eyebrow">CURRENT RUN</span><strong id="run-status">等待任务</strong></div><span id="run-dot" class="status-dot idle"></span></div><div class="progress"><span id="progress-bar"></span></div><div class="run-meta"><span id="step-count">0 / 8 steps</span><span id="run-time">—</span></div><div class="section-title">执行步骤 <span id="step-badge">0</span></div><ol id="steps" class="steps"></ol><div id="approval" class="approval" hidden><div class="approval-icon">!</div><div><strong>需要你的确认</strong><p>即将执行高风险操作：提交表单</p><button id="approve" class="approve">批准执行</button><button id="reject" class="reject">拒绝</button></div></div><div class="section-title result-title">运行结果</div><div id="result" class="result empty">任务结果将在这里显示</div></div><div id="page-view" class="page-view" hidden><div class="browser-bar">⌁ <span id="page-url">about:blank</span></div><div class="observation-card"><div class="mock-browser-head"><span></span><span></span><span></span><b id="page-title">等待页面</b></div><div id="page-content" class="mock-browser-content"><div class="page-placeholder">尚未开始观察页面</div></div></div><div class="observation-footer"><span>OBSERVATION</span><strong id="observation-id">—</strong><span class="token">约 0 tokens</span></div></div></aside></div></main></div><script src="/app.js"></script></body></html>
<style>[hidden]{display:none!important}</style>
