[project]
name = "lob-browser"
version = "0.1.0"
description = "A learning implementation of a reliable browser agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.55,<2",
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_browser"]
